openapi: 3.1.0
info:
  title: Smiley API
  version: 0.1.0
servers:
  - url: http://localhost:3000/api/v1
paths:
  /auth/register:
    post:
      summary: Register a user
      responses:
        "201":
          description: Created
  /auth/login:
    post:
      summary: Login
      responses:
        "200":
          description: Auth session
  /auth/password-reset/request:
    post:
      summary: Request password reset
      responses:
        "202":
          description: Accepted
  /auth/password-reset/confirm:
    post:
      summary: Confirm password reset
      responses:
        "204":
          description: Password updated
  /auth/refresh:
    post:
      summary: Rotate refresh token
      responses:
        "200":
          description: New auth session
  /auth/logout:
    post:
      summary: Revoke current refresh token
      responses:
        "204":
          description: Logged out
  /auth/logout-all:
    post:
      summary: Revoke all refresh tokens for the current user
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out everywhere
  /auth/sessions:
    get:
      summary: List login sessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sessions
  /auth/sessions/{id}:
    delete:
      summary: Revoke login session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Revoked
  /users/search:
    get:
      summary: Search users by username
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Search results
  /partnership-requests:
    post:
      summary: Create a partnership request
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
    get:
      summary: List pending partnership requests
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Requests
  /partnership-requests/{id}/accept:
    post:
      summary: Accept a partnership request
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Partnership created
  /partnership-requests/{id}/reject:
    post:
      summary: Reject a partnership request
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Rejected
  /partnership-requests/{id}/cancel:
    post:
      summary: Cancel an outgoing partnership request
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Cancelled
  /partnerships/current:
    get:
      summary: Get current partnership
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current partnership or null
  /partnerships/{id}/onboarding:
    post:
      summary: Complete relationship onboarding
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Activated partnership
  /space:
    get:
      summary: Get active world summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: World summary
  /me:
    get:
      summary: Get authenticated profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
    patch:
      summary: Update authenticated profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated profile
    delete:
      summary: Soft-delete account
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
  /partnerships/current/settings:
    patch:
      summary: Update active partnership settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Settings
  /posts:
    get:
      summary: List shared posts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Posts
    post:
      summary: Create a shared post
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /uploads/presign:
    post:
      summary: Create a signed media upload URL
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Pending upload and signed PUT URL
        "503":
          description: Storage is not configured
  /uploads/{id}/complete:
    post:
      summary: Complete a pending media upload
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Media asset
        "404":
          description: Upload not found
  /moods:
    get:
      summary: List moods
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Moods
    post:
      summary: Create mood update
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /messages:
    get:
      summary: List conversation messages
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Messages
    post:
      summary: Send idempotent text or media message
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /messages/read-all:
    post:
      summary: Mark all partner messages as read
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Updated
  /messages/{id}/delivered:
    post:
      summary: Mark message as delivered
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Receipt
  /messages/{id}/read:
    post:
      summary: Mark message as read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Receipt
  /calendar-events:
    get:
      summary: List calendar events
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Events
    post:
      summary: Create calendar event
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /occasions:
    get:
      summary: List occasions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Occasions
    post:
      summary: Create occasion
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /notifications:
    get:
      summary: List notifications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications
  /notifications/read-all:
    post:
      summary: Mark notifications as read
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Updated
  /notifications/preferences:
    get:
      summary: List notification preferences
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Preferences
    patch:
      summary: Update notification preference
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated preference
  /notifications/push-tokens:
    post:
      summary: Register device push token
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Registered
    delete:
      summary: Revoke device push token
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Revoked
  /wishes:
    get:
      summary: List wishes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Wishes
    post:
      summary: Create wish
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /wishes/{id}/toggle:
    post:
      summary: Toggle wish completion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated
  /goals:
    get:
      summary: List goals
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Goals
    post:
      summary: Create goal
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /goals/{id}/toggle:
    post:
      summary: Toggle goal completion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated
  /goal-steps/{id}/toggle:
    post:
      summary: Toggle goal step completion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated
  /shared-lists:
    get:
      summary: List shared lists
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lists
    post:
      summary: Create shared list
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /shared-lists/{id}/items:
    post:
      summary: Add shared list item
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /shared-list-items/{id}/toggle:
    post:
      summary: Toggle shared list item
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated
  /games:
    get:
      summary: List shared games
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Games
    post:
      summary: Create X/O game
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /games/{id}/moves:
    post:
      summary: Play X/O move
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated game
  /places:
    get:
      summary: List places
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Places
    post:
      summary: Create place
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /albums:
    get:
      summary: List albums
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Albums
    post:
      summary: Create album
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /albums/{id}/items:
    post:
      summary: Add media asset to album
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /music-room:
    get:
      summary: Get or create music room
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Music room
  /music-room/queue:
    post:
      summary: Add music queue item
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /watch-room:
    get:
      summary: Get or create watch room
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Watch room
  /watch-room/items:
    post:
      summary: Add watch item
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /tree/today:
    get:
      summary: Get today's tree day
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tree day
  /tree/leaves:
    post:
      summary: Create tree leaf
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /time-capsules:
    get:
      summary: List time capsules
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Time capsules
    post:
      summary: Create time capsule
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /account/export:
    get:
      summary: Export account data
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Export
  /reports:
    post:
      summary: Create report
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
