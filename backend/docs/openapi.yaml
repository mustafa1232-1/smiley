openapi: 3.1.0
info:
  title: Smiley API
  version: 0.1.0
servers:
  - url: http://localhost:3000/api/v1
paths:
  /auth/register:
    post:
      summary: Register a user with optional avatar URL
      responses:
        "201":
          description: Created
  /auth/login:
    post:
      summary: Login
      responses:
        "200":
          description: Auth session
  /auth/password-reset/request:
    post:
      summary: Request password reset
      responses:
        "202":
          description: Accepted
  /auth/password-reset/confirm:
    post:
      summary: Confirm password reset
      responses:
        "204":
          description: Password updated
  /auth/refresh:
    post:
      summary: Rotate refresh token
      responses:
        "200":
          description: New auth session
  /auth/logout:
    post:
      summary: Revoke current refresh token
      responses:
        "204":
          description: Logged out
  /auth/logout-all:
    post:
      summary: Revoke all refresh tokens for the current user
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out everywhere
  /auth/sessions:
    get:
      summary: List login sessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sessions
  /auth/sessions/{id}:
    delete:
      summary: Revoke login session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Revoked
  /users/search:
    get:
      summary: Search users by username
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Search results
  /me/email-verification/request:
    post:
      summary: Request email verification code
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Accepted
  /me/username:
    patch:
      summary: Change username
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Username updated
  /me/email-verification/confirm:
    post:
      summary: Confirm email verification code
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Email verified
  /me/phone-verification/request:
    post:
      summary: Request phone verification code
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Accepted
  /me/phone-verification/confirm:
    post:
      summary: Confirm phone verification code
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Phone verified
  /partnership-requests:
    post:
      summary: Create a partnership request
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
    get:
      summary: List pending partnership requests
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Requests
  /partnership-requests/{id}/accept:
    post:
      summary: Accept a partnership request
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Partnership created
  /partnership-requests/{id}/reject:
    post:
      summary: Reject a partnership request
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Rejected
  /partnership-requests/{id}/cancel:
    post:
      summary: Cancel an outgoing partnership request
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Cancelled
  /partnerships/current:
    get:
      summary: Get current partnership
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current partnership or null
  /partnerships/current/leave:
    post:
      summary: Leave current partnership
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Partnership ended
  /partnerships/{id}/onboarding:
    post:
      summary: Complete relationship onboarding and seed initial world items
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Activated partnership
  /space:
    get:
      summary: Get active world summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: World summary
  /relationship-summary:
    get:
      summary: Get neutral relationship summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Relationship summary
  /me:
    get:
      summary: Get authenticated profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
    patch:
      summary: Update authenticated profile, avatar URL, and favorites
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated profile
    delete:
      summary: Soft-delete account
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
  /partnerships/current/settings:
    patch:
      summary: Update active partnership settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Settings
  /posts:
    get:
      summary: List shared posts with cursor pagination
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Posts
    post:
      summary: Create a shared post
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /posts/{id}:
    patch:
      summary: Edit own post
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated post
    delete:
      summary: Soft-delete own post
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
  /posts/{id}/reactions:
    post:
      summary: React to post
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated post
  /posts/{id}/comments:
    post:
      summary: Comment on post
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Updated post
  /uploads/presign:
    post:
      summary: Create a signed media upload URL
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Pending upload and signed PUT URL
        "503":
          description: Storage is not configured
  /uploads/{id}/complete:
    post:
      summary: Complete a pending media upload and update storage usage
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Media asset
        "404":
          description: Upload not found
  /storage/usage:
    get:
      summary: Get user and relationship storage usage
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Storage usage
  /moods:
    get:
      summary: List moods
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Moods
    post:
      summary: Create mood update
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /messages:
    get:
      summary: List conversation messages with cursor pagination
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Messages
    post:
      summary: Send idempotent text or media message
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /messages/{id}/reactions:
    post:
      summary: React to message
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated message
  /messages/{id}:
    patch:
      summary: Edit own message
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated message
    delete:
      summary: Delete own message
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
  /messages/{id}/pin:
    post:
      summary: Pin or unpin message
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated message
  /messages/scheduled:
    get:
      summary: List scheduled conversation messages
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Scheduled messages
    post:
      summary: Schedule a text message
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Scheduled
  /messages/read-all:
    post:
      summary: Mark all partner messages as read
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Updated
  /messages/{id}/delivered:
    post:
      summary: Mark message as delivered
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Receipt
  /messages/{id}/read:
    post:
      summary: Mark message as read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Receipt
  /calendar-events:
    get:
      summary: List calendar events
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Events
    post:
      summary: Create calendar event
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /occasions:
    get:
      summary: List occasions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Occasions
    post:
      summary: Create occasion
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /notifications:
    get:
      summary: List notifications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications
  /notifications/read-all:
    post:
      summary: Mark notifications as read
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Updated
  /notifications/preferences:
    get:
      summary: List notification preferences
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Preferences
    patch:
      summary: Update notification preference
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated preference
  /notifications/push-tokens:
    post:
      summary: Register device push token
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Registered
    delete:
      summary: Revoke device push token
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Revoked
  /wishes:
    get:
      summary: List wishes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Wishes
    post:
      summary: Create wish
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /wishes/{id}/toggle:
    post:
      summary: Toggle wish completion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated
  /goals:
    get:
      summary: List goals
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Goals
    post:
      summary: Create goal
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /goals/{id}/toggle:
    post:
      summary: Toggle goal completion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated
  /goal-steps/{id}/toggle:
    post:
      summary: Toggle goal step completion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated
  /shared-lists:
    get:
      summary: List shared lists
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lists
    post:
      summary: Create shared list
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /shared-lists/{id}/items:
    post:
      summary: Add shared list item
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /shared-list-items/{id}/toggle:
    post:
      summary: Toggle shared list item
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated
  /games:
    get:
      summary: List shared games
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Games
    post:
      summary: Create shared game
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /games/{id}/moves:
    post:
      summary: Play X/O move
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated game
  /games/{id}/answer:
    post:
      summary: Answer daily prompt game
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated game
  /games/{id}/skip:
    post:
      summary: Skip daily prompt game
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated game
  /places:
    get:
      summary: List places
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Places
    post:
      summary: Create place
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /places/{id}/visits:
    post:
      summary: Record place visit
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /albums:
    get:
      summary: List albums
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Albums
    post:
      summary: Create album
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /albums/{id}/items:
    post:
      summary: Add media asset to album
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /music-room:
    get:
      summary: Get or create music room
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Music room
  /music-room/queue:
    post:
      summary: Add music queue item
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /music-room/playback:
    post:
      summary: Update music playback
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated room
  /watch-room:
    get:
      summary: Get or create watch room
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Watch room
  /watch-room/items:
    post:
      summary: Add watch item
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /watch-room/playback:
    post:
      summary: Update watch playback
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated room
  /tree/today:
    get:
      summary: Get today's tree day
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tree day
  /tree/leaves:
    post:
      summary: Create tree leaf
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /tree/leaves/{id}/contributions:
    post:
      summary: Add tree leaf contribution
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /time-capsules:
    get:
      summary: List time capsules without locked content
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Time capsules
    post:
      summary: Create time capsule
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /time-capsules/{id}/open:
    post:
      summary: Open a time capsule after its opening date
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Opened capsule
        "409":
          description: Capsule is still locked
  /account/export:
    get:
      summary: Export account data
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Export
  /reports:
    post:
      summary: Create report
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /blocks:
    get:
      summary: List blocked users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Block list
  /blocks/partner:
    post:
      summary: Block current partner
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /blocks/{blockedId}:
    delete:
      summary: Unblock user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: blockedId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
