services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smiley
      POSTGRES_USER: smiley
      POSTGRES_PASSWORD: smiley
    ports:
      - "5432:5432"
    volumes:
      - smiley_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  smiley_postgres:
